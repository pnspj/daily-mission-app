name: Notify CI Failure

on:
  workflow_run:
    workflows: ["CI", "OSSF Scorecard"]
    types: [completed]

permissions:
  contents: read

jobs:
  create-issue:
    name: Create Failure Issue
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450  # v2.19.1
        with:
          egress-policy: audit
      - name: Create or comment on failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          title="CI failure: ${WORKFLOW_NAME}"
          body="$(printf 'Workflow **%s** failed on `main`.\n\nRun: %s' "${WORKFLOW_NAME}" "${RUN_URL}")"
          # Comment on the existing open issue instead of filing duplicates
          number=$(gh issue list --state open --label ci-failure \
            --json number,title --jq ".[] | select(.title == \"${title}\") | .number" | head -n1)
          if [ -n "${number}" ]; then
            gh issue comment "${number}" --body "${body}"
          else
            gh issue create --title "${title}" --label ci-failure --body "${body}"
          fi
